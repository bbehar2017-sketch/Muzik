<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muzika ime</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:#111; color:#eee; }
  .wrap { max-width:720px; margin:0 auto; padding:14px; }
  h1 { font-size:20px; margin:6px 0 12px; }
  h2 { font-size:15px; color:#aaa; margin:16px 0 8px; }
  .row { display:flex; gap:8px; margin-bottom:8px; }
  input { flex:1; min-width:0; padding:12px; border-radius:8px; border:1px solid #333; background:#1c1c1c; color:#eee; font-size:16px; }
  button { padding:12px 14px; border:0; border-radius:8px; background:#e53935; color:#fff; font-size:15px; cursor:pointer; }
  button.sec { background:#2a2a2a; }
  .player { position:relative; padding-top:56.25%; margin:12px 0; background:#000; border-radius:10px; overflow:hidden; }
  .player.audio { padding-top:0; height:80px; }
  .player #yt, .player iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .controls { display:flex; gap:8px; flex-wrap:wrap; }
  ul { list-style:none; padding:0; margin:0; }
  li { display:flex; align-items:center; gap:10px; padding:8px; border-radius:8px; background:#1a1a1a; margin-bottom:6px; cursor:pointer; }
  li.active { background:#3a1414; }
  li img { width:96px; height:54px; object-fit:cover; border-radius:6px; flex-shrink:0; }
  li span { flex:1; font-size:14px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  li button { padding:8px 10px; font-size:13px; flex-shrink:0; }
  .hint { color:#888; font-size:13px; }
  #keyBox { background:#1a1a1a; padding:12px; border-radius:10px; margin-bottom:12px; }
  .hidden { display:none; }
  select { flex:1; min-width:0; padding:10px; border-radius:8px; border:1px solid #333; background:#1c1c1c; color:#eee; font-size:15px; }
  .chk { display:flex; align-items:center; gap:6px; font-size:14px; white-space:nowrap; }
  .chk input { width:20px; height:20px; flex:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎵 Muzika ime</h1>

  <div id="keyBox" class="hidden">
    <p class="hint">Për kërkim duhet një çelës falas nga YouTube (API Key). Ngjite këtu një herë, ruhet në këtë celular.</p>
    <div class="row">
      <input id="keyInput" placeholder="API Key…">
      <button onclick="saveKey()">Ruaj</button>
    </div>
  </div>

  <div class="row">
    <input id="q" placeholder="Kërko këngë…" onkeydown="if(event.key==='Enter')search()">
    <button onclick="search()">🔍</button>
  </div>
  <div class="row">
    <select id="sort" onchange="search()">
      <option value="month">🔥 Hitet e këtij muaji</option>
      <option value="week">🆕 Këtë javë</option>
      <option value="year">📅 Këtë vit</option>
      <option value="date">⏱ Më të rejat (sipas datës)</option>
      <option value="all">🔎 Të gjitha</option>
    </select>
    <label class="chk"><input type="checkbox" id="noMix" checked onchange="search()"> Pa mikse</label>
  </div>
  <ul id="results"></ul>

  <div id="box" class="player"><div id="yt"></div></div>
  <div class="controls">
    <button class="sec" onclick="prev()">⏮</button>
    <button class="sec" onclick="next()">⏭</button>
    <button class="sec" id="loopBtn" onclick="toggleLoop()">🔁 JO</button>
    <button class="sec" onclick="toggleAudio()">🎧 Zë/Video</button>
    <button class="sec" onclick="showKey()">🔑</button>
  </div>

  <h2>Lista ime</h2>
  <ul id="list"></ul>
  <p class="hint">Kliko një rezultat për ta luajtur, ose ➕ për ta shtuar në listë.</p>
</div>

<script>
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
let songs = store.get('mySongs', []);
let apiKey = store.get('ytKey', '');
let current = -1, loop = false, player = null, pending = null;

function esc(s){ const d = document.createElement('div'); d.innerHTML = s; return d.textContent; }

/* ---- API Key ---- */
function showKey(){ document.getElementById('keyBox').classList.toggle('hidden'); document.getElementById('keyInput').value = apiKey; }
function saveKey(){
  apiKey = document.getElementById('keyInput').value.trim();
  store.set('ytKey', apiKey);
  document.getElementById('keyBox').classList.add('hidden');
}
if (!apiKey) document.getElementById('keyBox').classList.remove('hidden');

/* ---- Kërkimi ---- */
async function search(){
  const q = document.getElementById('q').value.trim();
  const ul = document.getElementById('results');
  if (!q) return;
  if (!apiKey) { showKey(); return; }
  ul.innerHTML = '<li><span>Duke kërkuar…</span></li>';
  try {
    const sort = document.getElementById('sort').value;
    const days = { week: 7, month: 30, year: 365 }[sort];
    let url = 'https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=40'
      + '&videoCategoryId=10&relevanceLanguage=sq'
      + '&q=' + encodeURIComponent(q) + '&key=' + encodeURIComponent(apiKey);
    if (days) {
      url += '&order=viewCount&publishedAfter=' + new Date(Date.now() - days * 864e5).toISOString();
    } else if (sort === 'date') {
      url += '&order=date';
    }
    const r = await fetch(url);
    const d = await r.json();
    if (d.error) throw new Error(d.error.message);
    const mixRe = /\bmix|hitet e reja|kolazh|playlist|non.?stop|potpuri|muzik(a)? shqip 20\d\d|top \d+|\d+\s*(min|or[eë]|hour)/i;
    let items = d.items;
    if (document.getElementById('noMix').checked) {
      items = items.filter(it => !mixRe.test(esc(it.snippet.title)));
    }
    ul.innerHTML = '';
    if (!items.length) ul.innerHTML = '<li><span>Asnjë rezultat. Provo "Të gjitha" ose hiqe "Pa mikse".</span></li>';
    items.forEach(it => {
      const s = { id: it.id.videoId, title: esc(it.snippet.title), thumb: it.snippet.thumbnails.medium.url };
      const li = document.createElement('li');
      li.innerHTML = '<img><span></span><button>➕</button>';
      li.querySelector('img').src = s.thumb;
      li.querySelector('span').textContent = s.title;
      li.onclick = () => { songs.push(s); store.set('mySongs', songs); play(songs.length - 1); };
      li.querySelector('button').onclick = e => {
        e.stopPropagation(); songs.push(s); store.set('mySongs', songs); render();
        e.target.textContent = '✓';
      };
      ul.appendChild(li);
    });
  } catch(err) {
    ul.innerHTML = '';
    const li = document.createElement('li');
    li.innerHTML = '<span></span>';
    li.querySelector('span').textContent = 'Gabim: ' + err.message;
    ul.appendChild(li);
  }
}

/* ---- Lista ---- */
function render(){
  const ul = document.getElementById('list');
  ul.innerHTML = '';
  songs.forEach((s, i) => {
    const li = document.createElement('li');
    if (i === current) li.className = 'active';
    li.innerHTML = '<img><span></span><button class="sec">✕</button>';
    li.querySelector('img').src = s.thumb || ('https://i.ytimg.com/vi/' + s.id + '/mqdefault.jpg');
    li.querySelector('span').textContent = (i + 1) + '. ' + s.title;
    li.onclick = () => play(i);
    li.querySelector('button').onclick = e => {
      e.stopPropagation(); songs.splice(i, 1);
      if (i < current) current--; else if (i === current) current = -1;
      store.set('mySongs', songs); render();
    };
    ul.appendChild(li);
  });
}

/* ---- Player ---- */
function play(i){
  if (!songs[i]) return;
  current = i; render();
  if (player && player.loadVideoById) player.loadVideoById(songs[i].id);
  else if (window.YT && YT.Player) createPlayer(songs[i].id);
  else pending = songs[i].id;
  window.scrollTo({ top: document.getElementById('box').offsetTop - 10, behavior: 'smooth' });
}
function next(){ if (songs.length) play((current + 1) % songs.length); }
function prev(){ if (songs.length) play((current - 1 + songs.length) % songs.length); }
function toggleLoop(){ loop = !loop; document.getElementById('loopBtn').textContent = '🔁 ' + (loop ? 'PO' : 'JO'); }
function toggleAudio(){ document.getElementById('box').classList.toggle('audio'); }

function createPlayer(id){
  player = new YT.Player('yt', {
    host: 'https://www.youtube.com',
    videoId: id,
    playerVars: { autoplay: 1, rel: 0, playsinline: 1 },
    events: { onStateChange: e => { if (e.data === YT.PlayerState.ENDED) { loop ? player.playVideo() : next(); } } }
  });
}
window.onYouTubeIframeAPIReady = () => { if (pending) { createPlayer(pending); pending = null; } };
const tag = document.createElement('script');
tag.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(tag);

render();
</script>
</body>
</html>
